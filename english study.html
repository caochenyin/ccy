<!-- 
    單詞默寫射擊遊戲 - Word Spelling Shooter Game
    更新內容：
    1. 新增了可折疊的「單詞庫設置」面板，允許用戶輸入自定義單詞。
    2. 強化了遊戲開始時讀取自定義單詞的邏輯。
    3. 【關鍵更新】修改繪圖邏輯：現在小行星上只顯示中文翻譯，要求玩家純粹回憶英文拼寫。
    4. 【速度調整】顯著降低了所有關卡的小行星速度和生成頻率，使遊戲更容易上手。
    5. 【界面優化】在中文翻譯旁添加了對應的 Emoji 圖標，提供視覺輔助。
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單詞默寫射擊遊戲 - 挑戰八年級英語</title>
    <!-- 引入 Tailwind CSS 確保基礎佈局美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Tone.js 用於音效 -->
    <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117; /* GitHub Dark Background */
            color: #c9d1d9; /* Light text */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            background-color: #161b22; /* Slightly lighter inner background */
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 1rem;
        }
        canvas {
            background-color: #010409; /* Deep space background */
            border: 3px solid #30363d;
            border-radius: 0.5rem;
            width: 100%;
            height: 400px; /* Fixed height for canvas */
            cursor: text; /* Indicate typing input */
        }
        .ui-panel {
            background-color: #21262d;
            border-radius: 0.5rem;
        }
        .status-text {
            color: #58a6ff; /* GitHub link blue */
            font-weight: 600;
        }
        .typing-input {
            font-size: 1.25rem;
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid #58a6ff;
            background-color: #0d1117;
            color: #3fb950; /* Green for current input */
            text-shadow: 0 0 5px #3fb950;
        }
        .button-style {
            background-color: #3fb950; /* Green button */
            transition: all 0.2s;
        }
        .button-style:hover {
            background-color: #238636;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* Game Over Modal Styling */
        #game-over-modal {
            position: fixed; /* Use fixed for full viewport coverage */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 10;
            display: none; /* Controlled by JS */
            align-items: center;
            justify-content: center;
        }
        .editor-container {
            max-height: 300px; /* 限制編輯器高度 */
            overflow-y: auto;
            transition: all 0.3s ease-out;
            opacity: 1;
        }
        .hidden-editor {
            max-height: 0;
            opacity: 0;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            overflow: hidden;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="game-container" class="space-y-4">
        <h1 class="text-3xl font-bold text-center text-green-400">八年級單詞射擊大挑戰</h1>
        <p class="text-center text-sm text-gray-400">規則：輸入飄落的單詞來「射擊」小行星！拼寫錯誤會導致射擊失敗。</p>

        <!-- 狀態面板: 關卡與分數顯示 -->
        <div class="ui-panel flex justify-between p-3">
            <div class="text-lg">分數：<span id="score-display" class="status-text">0</span></div>
            <div class="text-lg">關卡：<span id="level-display" class="status-text text-yellow-400">Level 1 (入門)</span></div>
            <div class="text-lg">生命：<span id="lives-display" class="status-text text-red-400">3</span></div>
        </div>
        
        <!-- 單詞庫設置面板 (可折疊) -->
        <div class="ui-panel p-3 space-y-3">
            <button id="toggle-editor-button" class="w-full text-left font-semibold text-white/90 hover:text-white transition duration-200">
               ⚙️ 單詞庫設置 (點擊展開/收起)
            </button>
            
            <div id="word-editor-content" class="editor-container transition-all duration-500 hidden-editor space-y-2">
                <p class="text-xs text-gray-400">請輸入您的單詞，每行一個，格式為：<code class="bg-gray-700 p-1 rounded">英文單詞:中文翻譯</code></p>
                <textarea id="custom-word-list" rows="5" class="w-full p-2 bg-gray-700 text-sm text-gray-200 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例如：&#10;travel:旅行&#10;important:重要的&#10;museum:博物館"></textarea>
                <p class="text-xs text-yellow-300" id="word-count-display">當前使用：默認詞彙庫 (20 個單詞)</p>
            </div>
        </div>

        <!-- 遊戲畫布 -->
        <canvas id="wordCanvas"></canvas>

        <!-- 輸入與控制面板 -->
        <div class="flex flex-col space-y-3">
            <div class="relative">
                <input type="text" id="typing-input" class="typing-input w-full p-3 rounded-lg focus:outline-none" 
                       placeholder="點擊此處開始輸入..." autocomplete="off" autofocus disabled>
                <div id="target-word-display" class="absolute top-1/2 left-4 transform -translate-y-1/2 text-xl font-mono opacity-50 pointer-events-none">
                    等待目標...
                </div>
            </div>
            
            <button id="start-button" class="button-style text-white p-3 rounded-lg font-semibold uppercase">
                開始遊戲
            </button>
        </div>
    </div>

    <!-- 遊戲結束模態框 -->
    <div id="game-over-modal">
        <div class="bg-gray-800 p-8 rounded-xl text-center shadow-2xl space-y-4 max-w-sm">
            <h2 class="text-4xl font-extrabold text-red-500">遊戲結束!</h2>
            <p class="text-xl text-gray-300">您的最終得分是：<span id="final-score" class="text-yellow-400 font-bold">0</span></p>
            <p class="text-sm text-gray-400">擊中小行星越多，分數越高！</p>
            <button id="restart-button" class="button-style w-full p-3 rounded-lg font-semibold uppercase">
                重新開始
            </button>
        </div>
    </div>

    <script>
        // --- Configuration and Game Assets ---
        
        // 默認的八年級英語詞彙庫 (英文單詞、中文翻譯及圖標)
        const DEFAULT_WORD_POOL = [
            { en: 'travel', zh: '旅行', icon: '✈️' },
            { en: 'delicious', zh: '美味的', icon: '🍔' },
            { en: 'museum', zh: '博物館', icon: '🏛️' },
            { en: 'weather', zh: '天氣', icon: '☀️' },
            { en: 'exciting', zh: '令人興奮的', icon: '🤩' },
            { en: 'improve', zh: '提高', icon: '⬆️' },
            { en: 'favorite', zh: '最喜歡的', icon: '❤️' },
            { en: 'history', zh: '歷史', icon: '📜' },
            { en: 'future', zh: '未來', icon: '🔮' },
            { en: 'healthy', zh: '健康的', icon: '🍎' },
            { en: 'different', zh: '不同的', icon: '🔀' },
            { en: 'because', zh: '因為', icon: '❓' },
            { en: 'science', zh: '科學', icon: '🔬' },
            { en: 'suggest', zh: '建議', icon: '💡' },
            { en: 'important', zh: '重要的', icon: '⭐' },
            { en: 'remember', zh: '記得', icon: '🧠' },
            { en: 'problem', zh: '問題', icon: '❌' },
            { en: 'receive', zh: '收到', icon: '📦' },
            { en: 'holiday', zh: '假日', icon: '🏝️' },
            { en: 'station', zh: '車站', icon: '🚉' }
        ];

        // 10 個關卡難度配置 (速度和生成頻率已降低)
        const LEVEL_SETTINGS = [
            { threshold: 0, speed: 0.3, rate: 2500, name: "Level 1 (入門)" }, // 速度慢，間隔長
            { threshold: 200, speed: 0.4, rate: 2200, name: "Level 2 (基礎)" },
            { threshold: 500, speed: 0.5, rate: 1900, name: "Level 3 (提升)" },
            { threshold: 800, speed: 0.6, rate: 1600, name: "Level 4 (中級)" },
            { threshold: 1200, speed: 0.7, rate: 1300, name: "Level 5 (進階)" },
            { threshold: 1700, speed: 0.8, rate: 1100, name: "Level 6 (挑戰)" },
            { threshold: 2300, speed: 0.9, rate: 900, name: "Level 7 (專家)" },
            { threshold: 3000, speed: 1.0, rate: 800, name: "Level 8 (大師)" },
            { threshold: 3800, speed: 1.1, rate: 700, name: "Level 9 (極限)" },
            { threshold: 4700, speed: 1.2, rate: 600, name: "Level 10 (詞彙獵人)" },
        ];


        // --- DOM Elements and Canvas Setup ---
        const canvas = document.getElementById('wordCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        const levelDisplay = document.getElementById('level-display');
        const typingInput = document.getElementById('typing-input');
        const targetWordDisplay = document.getElementById('target-word-display');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreDisplay = document.getElementById('final-score');
        
        // 新增的單詞庫相關 DOM
        const toggleEditorButton = document.getElementById('toggle-editor-button');
        const wordEditorContent = document.getElementById('word-editor-content');
        const customWordListTextarea = document.getElementById('custom-word-list');
        const wordCountDisplay = document.getElementById('word-count-display');

        // 設定 Canvas 尺寸以適應容器
        const setCanvasSize = () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = 400;
        };
        window.addEventListener('resize', setCanvasSize);
        setCanvasSize();

        // --- Game State Variables ---
        let gameInterval;
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isGameRunning = false;
        let activeAsteroids = [];
        let targetAsteroid = null; // 玩家當前正在打的單詞
        let currentLevelIndex = 0; // 當前關卡的索引 (0-9)
        let spawnRate = LEVEL_SETTINGS[0].rate; // 小行星生成間隔 (ms)
        let baseSpeed = LEVEL_SETTINGS[0].speed; // 小行星基礎移動速度
        let lastSpawnTime = 0;
        let currentWordPool = []; // 動態使用的單詞庫

        // --- Sound Effects Setup (Tone.js) ---
        // Tone.Synth 是一個簡單的合成器，用於生成音效
        const hitSynth = new Tone.Synth({
            oscillator: { type: "sine" },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
        }).toDestination();
        
        const missSynth = new Tone.Synth({
            oscillator: { type: "square" },
            envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.3 }
        }).toDestination();
        
        const loseLifeSynth = new Tone.Synth({
            oscillator: { type: "sawtooth" },
            envelope: { attack: 0.05, decay: 0.5, sustain: 0, release: 0.5 }
        }).toDestination();

        // --- Asteroid Class ---
        class Asteroid {
            constructor(wordObj) {
                this.originalWord = wordObj.en;
                this.translation = wordObj.zh;
                this.icon = wordObj.icon || '💬'; // 默認圖標
                this.remainingWord = wordObj.en; // 剩餘未打的單詞
                this.x = Math.random() * (canvas.width - 200) + 100; // 隨機 X 軸位置
                this.y = 0; // 頂部開始
                this.speedOffset = Math.random() * 0.5; 
                this.fontSize = 20;
                this.height = this.fontSize + 10;
                this.color = `hsl(${Math.random() * 360}, 70%, 50%)`; // 隨機顏色
            }

            update() {
                // 速度計算: 當前關卡基礎速度 + 隨機偏移
                this.y += baseSpeed + this.speedOffset; 

                // 檢查是否超出底線
                if (this.y + this.height > canvas.height) {
                    loseLifeSynth.triggerAttackRelease("C3", "0.5");
                    this.markForRemoval = true;
                    loseLife();
                }
            }

            draw() {
                ctx.save();
                
                const text = this.translation;
                const icon = this.icon;
                const iconSize = 24; // Emoji 圖標大小
                const textHeight = 20; // 中文文本大小
                const padding = 8; // 圖標與文本間距

                // 測量中文文本寬度
                ctx.font = `${textHeight}px 'Inter', sans-serif`; 
                const textWidth = ctx.measureText(text).width;
                const totalContentWidth = iconSize + padding + textWidth;
                
                // 計算左起始點，使整個區塊以 this.x 居中
                const startX = this.x - totalContentWidth / 2;

                // 設置文本基準線
                ctx.textBaseline = 'top';

                // 1. 繪製圖標 (Emoji)
                ctx.font = `${iconSize}px 'Inter', sans-serif`; 
                ctx.textAlign = 'left';
                ctx.fillText(icon, startX, this.y); 

                // 2. 繪製中文翻譯
                ctx.font = `${textHeight}px 'Inter', sans-serif`; 
                ctx.fillStyle = '#c9d1d9'; 
                ctx.textAlign = 'left';
                
                const textY = this.y + (iconSize - textHeight) / 2; // 垂直居中對齊
                const textX = startX + iconSize + padding;
                ctx.fillText(text, textX, textY); 
                
                ctx.restore();
            }

            match(key) {
                if (this.remainingWord.length > 0 && this.remainingWord[0].toLowerCase() === key.toLowerCase()) {
                    this.remainingWord = this.remainingWord.substring(1);
                    return true;
                }
                return false;
            }

            isComplete() {
                return this.remainingWord.length === 0;
            }
        }

        // --- Custom Word Loading Logic (新增) ---
        function parseCustomWords() {
            const customText = customWordListTextarea.value.trim();
            if (customText === '') {
                return []; // 返回空列表，表示使用默認詞庫
            }

            const newWords = [];
            const lines = customText.split('\n');
            lines.forEach(line => {
                const parts = line.split(':');
                if (parts.length === 2) {
                    const en = parts[0].trim().toLowerCase();
                    const zh = parts[1].trim();
                    if (en && zh) {
                        // 自定義單詞賦予預設圖標
                        newWords.push({ en: en, zh: zh, icon: '💬' }); 
                    }
                }
            });
            return newWords;
        }

        function loadWordPool() {
            const customWords = parseCustomWords();
            if (customWords.length > 0) {
                currentWordPool = customWords;
                wordCountDisplay.textContent = `當前使用：自定義詞彙庫 (${currentWordPool.length} 個單詞)`;
            } else {
                currentWordPool = [...DEFAULT_WORD_POOL];
                wordCountDisplay.textContent = `當前使用：默認詞彙庫 (${currentWordPool.length} 個單詞)`;
            }

            if (currentWordPool.length === 0) {
                 // 緊急情況：如果連默認詞庫都沒有，則顯示錯誤
                 console.error("錯誤：詞彙庫為空，無法開始遊戲！請輸入單詞。");
                 return false;
            }
            return true;
        }

        function spawnAsteroid() {
            const randomIndex = Math.floor(Math.random() * currentWordPool.length);
            const newAsteroid = new Asteroid(currentWordPool[randomIndex]);
            activeAsteroids.push(newAsteroid);
        }

        // 核心邏輯：根據得分更新關卡難度 (速度和生成率)
        function updateLevel() {
            // 從最高級別往下檢查，確保獲得當前得分能達到的最高級別
            for (let i = LEVEL_SETTINGS.length - 1; i >= 0; i--) {
                if (score >= LEVEL_SETTINGS[i].threshold && i > currentLevelIndex) {
                    currentLevelIndex = i;
                    
                    // 應用新關卡設定
                    baseSpeed = LEVEL_SETTINGS[currentLevelIndex].speed;
                    spawnRate = LEVEL_SETTINGS[currentLevelIndex].rate;

                    // 更新 UI 顯示
                    levelDisplay.textContent = LEVEL_SETTINGS[currentLevelIndex].name;
                    return;
                }
            }
        }

        function addScore(points) {
            score += points;
            scoreDisplay.textContent = score;
            // 每獲得分數後檢查是否升級
            updateLevel(); 
        }

        function loseLife() {
            lives -= 1;
            livesDisplay.textContent = lives;
            typingInput.value = ''; // 清除輸入框
            targetAsteroid = null; // 清除目標
            targetWordDisplay.textContent = '等待目標...'; // 更新提示
            
            if (lives <= 0) {
                endGame();
            }
        }

        function endGame() {
            isGameOver = true;
            isGameRunning = false;
            // 停止動畫循環
            cancelAnimationFrame(gameInterval); 
            
            typingInput.disabled = true;
            typingInput.value = '';
            
            finalScoreDisplay.textContent = score;
            gameOverModal.style.display = 'flex';
        }

        // --- Main Game Loop ---
        function animate(currentTime) {
            if (isGameOver) return;
            
            gameInterval = requestAnimationFrame(animate);

            // 清除畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 處理小行星生成
            if (currentTime - lastSpawnTime > spawnRate) {
                spawnAsteroid();
                lastSpawnTime = currentTime;
            }

            // 更新並繪製小行星
            activeAsteroids.forEach(asteroid => {
                asteroid.update();
                asteroid.draw();
            });

            // 移除已完成或超出範圍的小行星
            activeAsteroids = activeAsteroids.filter(a => !a.markForRemoval);
        }

        // --- Input Handling ---
        typingInput.addEventListener('input', (e) => {
            if (!isGameRunning || isGameOver) return;
            
            const typedText = e.target.value.toLowerCase();
            const lastChar = typedText.slice(-1);

            // 1. 尋找或鎖定目標
            if (!targetAsteroid) {
                // 尋找第一個以輸入字母開頭的小行星
                const potentialTarget = activeAsteroids.find(a => a.remainingWord.toLowerCase().startsWith(lastChar));
                
                if (potentialTarget) {
                    targetAsteroid = potentialTarget;
                    // 在鎖定目標後，底部提示顯示英文單詞，方便玩家記憶拼寫進度
                    targetWordDisplay.textContent = targetAsteroid.originalWord; 
                } else {
                    // 如果沒有匹配，清空輸入 (Miss)
                    e.target.value = '';
                    missSynth.triggerAttackRelease("G2", "0.1");
                    return;
                }
            }
            
            // 2. 匹配字母
            if (targetAsteroid && targetAsteroid.remainingWord.toLowerCase().startsWith(lastChar)) {
                // 正確匹配
                targetAsteroid.remainingWord = targetAsteroid.remainingWord.substring(1);
                hitSynth.triggerAttackRelease("C5", "0.05"); // 擊中音效
                
                // 檢查是否完成單詞
                if (targetAsteroid.isComplete()) {
                    addScore(targetAsteroid.originalWord.length * 10); // 根據單詞長度加分
                    targetAsteroid.markForRemoval = true;
                    targetAsteroid = null; // 解鎖目標
                    e.target.value = ''; // 清空輸入
                    targetWordDisplay.textContent = '等待目標...';
                }
            } else {
                // 錯誤輸入
                e.target.value = ''; // 清空輸入，要求重新開始打字
                missSynth.triggerAttackRelease("D2", "0.1");
                targetAsteroid = null; // 解鎖目標
                targetWordDisplay.textContent = '輸入錯誤，請重新開始拼寫!';
            }
            
            // 由於我們只處理最後一個字符，每次都要清空輸入框以保持遊戲機制
            if(targetAsteroid && !targetAsteroid.isComplete()){
                e.target.value = ''; // 鎖定目標後，清除輸入框，讓玩家準備下一個字母
            }
        });


        // 阻止 Backspace, Space 等鍵影響遊戲或瀏覽器行為
        document.addEventListener('keydown', (e) => {
            if (!isGameRunning) return;
            
            // 阻止 spacebar 滾動頁面或影響遊戲輸入
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
            }
            
            // 確保輸入框獲得焦點
            if (document.activeElement !== typingInput) {
                typingInput.focus();
            }
        });

        // --- Editor Toggle Logic (新增) ---
        toggleEditorButton.addEventListener('click', () => {
            wordEditorContent.classList.toggle('hidden-editor');
            if (!wordEditorContent.classList.contains('hidden-editor')) {
                // 如果展開了，確保顯示當前使用的詞彙庫數量
                loadWordPool(); 
            }
        });

        customWordListTextarea.addEventListener('input', () => {
            // 實時更新詞彙數量顯示
            const customWords = parseCustomWords();
            if (customWords.length > 0) {
                wordCountDisplay.textContent = `將使用：自定義詞彙庫 (${customWords.length} 個單詞)`;
                wordCountDisplay.classList.remove('text-yellow-300');
                wordCountDisplay.classList.add('text-green-400');
            } else {
                wordCountDisplay.textContent = `當前使用：默認詞彙庫 (${DEFAULT_WORD_POOL.length} 個單詞)`;
                wordCountDisplay.classList.add('text-yellow-300');
                wordCountDisplay.classList.remove('text-green-400');
            }
        });

        // --- Initialization and Start/Restart ---
        function resetGame() {
            score = 0;
            lives = 3;
            isGameOver = false;
            activeAsteroids = [];
            targetAsteroid = null;
            
            // 重置到 Level 1 的設定
            currentLevelIndex = 0;
            baseSpeed = LEVEL_SETTINGS[0].speed;
            spawnRate = LEVEL_SETTINGS[0].rate;

            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            levelDisplay.textContent = LEVEL_SETTINGS[0].name; // 初始化關卡顯示
            typingInput.value = '';
            targetWordDisplay.textContent = '等待目標...';
            
            gameOverModal.style.display = 'none';
        }

        function startGame() {
            if (isGameRunning) return;
            
            // 載入自定義單詞庫或默認詞彙庫
            if (!loadWordPool()) {
                return; // 如果詞彙庫為空，則不啟動遊戲
            }

            resetGame();
            isGameRunning = true;
            typingInput.disabled = false;
            typingInput.focus();
            startButton.style.display = 'none';

            // 遊戲開始後隱藏單詞庫編輯器，防止中途更改
            wordEditorContent.classList.add('hidden-editor');

            lastSpawnTime = performance.now();
            // 使用 requestAnimationFrame 啟動動畫循環
            animate(lastSpawnTime);
        }

        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);

        // 初始化時確保顯示當前詞彙庫數量
        loadWordPool(); 

    </script>
</body>
</html>
